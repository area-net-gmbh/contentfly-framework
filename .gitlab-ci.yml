# Pipeline des Contentfly-Frameworks.
#
# Fährt beide Testsuiten gegen eine frisch installierte Instanz. Der Sinn steht in
# an_project/work/epic/008-testnetz/: Ein Testnetz, das nur auf einer Maschine läuft, ist
# beim Kernel-Umbau wertlos — niemand fährt es dann noch.
#
# ANNAHME, die vor dem ersten Lauf zu prüfen ist:
#   Es steht ein Runner mit DOCKER-EXECUTOR bereit. Ohne den funktioniert weder `image:`
#   noch `services:`. Ist nur ein Shell-Runner verfügbar, muss der Job Datenbank und PHP
#   selbst mitbringen — das wäre ein anderer Zuschnitt, nicht eine kleine Änderung.
#
# EINZUTRAGEN in Settings → CI/CD → Variables, bevor die Pipeline zum ersten Mal läuft:
#   CONTENTFLY_TEST_ADMIN_PASS   Passwort des Admin-Benutzers der Testinstanz.
#                                Bewusst nicht in dieser Datei — auch für eine flüchtige
#                                Datenbank gehört ein Passwort nicht ins Repo.
#
# Die eigentlichen Schritte stehen in tools/ci/*.sh, nicht hier. Grund: Eine
# Pipeline-Definition, deren Schritte man nur in der Pipeline ausprobieren kann, ist beim
# Suchen eines Fehlers nutzlos. Dieselben Skripte laufen lokal in Docker.
#
# Der Composer-Bootstrap stand bis 000-000-0029 dreimal woertlich gleich in dieser Datei und
# steht jetzt in tools/ci/install-composer.sh — aus demselben Grund, und weil er im
# Fehlerfall schwieg. Ein Schritt, dessen Ausgabe umgeleitet oder unterdrueckt wird, laeuft
# seitdem ueber die Funktion aus tools/ci/schritt.sh, die im Fehlerfall die letzten Zeilen
# seines Logs zeigt. Ein eigener Test haelt fest, dass es so bleibt.

stages:
  - check
  - test

variables:
  # Eingeloest mit 006-002-0004: PHPUnit liegt seit 006-002-0003 im Root-`require-dev`.
  # Die Vorsorge aus 008-005-0001 hat sich ausgezahlt — es war genau eine Zeile.
  #
  # ACHTUNG, solange 006-003 aussteht: `vendor/` liegt noch committed im Repo, und zwar im
  # ALTEN Stand ohne PHPUnit. Der Job braucht deshalb ein `composer install`, bevor dieser
  # Pfad existiert — siehe before_script.
  PHPUNIT: "./vendor/bin/phpunit"

  # ── Der MySQL-Service ───────────────────────────────────────────────────────────────
  MYSQL_DATABASE: contentfly
  MYSQL_USER: contentfly
  MYSQL_PASSWORD: contentfly
  MYSQL_ROOT_PASSWORD: root

  # ── Was die Suite über ihre Umgebung wissen muss ────────────────────────────────────
  # Im Service-Netz ist der Port 3306; das 3307 aus docker-compose.yml ist nur die
  # lokale Umgehung eines belegten Standard-Ports.
  CONTENTFLY_TEST_DB_HOST: mysql
  CONTENTFLY_TEST_DB_PORT: "3306"
  CONTENTFLY_TEST_DB_NAME: contentfly
  CONTENTFLY_TEST_DB_USER: contentfly
  CONTENTFLY_TEST_DB_PASSWORD: contentfly
  CONTENTFLY_TEST_BASE_URL: "http://127.0.0.1:8145"
  CONTENTFLY_TEST_MAIL_TRAP: "$CI_PROJECT_DIR/.ci-mailtrap"

  # Signaturgeheimnis fuer die JWT-Tests (013-003-0001). Ein fester Wert ist hier richtig: Die
  # Pipeline faehrt gegen eine Wegwerf-Datenbank und einen Testserver, die mit dem Job
  # verschwinden. Ein Geheimnis, das nichts schuetzt, muss auch nicht geheim sein — und ein
  # variabler Wert machte den Lauf schwerer nachzuspielen.
  #
  # Mindestens 32 Byte: firebase/php-jwt weist fuer HS256 kuerzere Schluessel ab.
  CONTENTFLY_TEST_JWT_SECRET: "ci-only-jwt-secret-mit-genug-laenge-32"

  # Speist den ExampleProvider aus 013-004-0004 — kennung:geheimnis:gruppe|gruppe.
  # Wegwerf-Werte fuer eine Wegwerf-Datenbank; ohne diese Variable laesst die Vorlage
  # niemanden herein, und genau das misst ein eigener Test.
  CONTENTFLY_TEST_PROVIDER: "external-one:ci-only-provider-secret:CN=Editorial"

  GIT_DEPTH: "1"

# ── Prüfungen, die keine Umgebung brauchen ─────────────────────────────────────────────

check:template-config:
  stage: check
  image: alpine:3
  # custom/config.php ist die Vorlage, aus der appcms:install die Konfiguration macht. Nach
  # einer lokalen Installation trägt sie Host, Benutzer und Passwort — und ein `git add -A`
  # genügt, damit das in der Historie landet. Der Job ist die zweite Schicht: Der
  # pre-commit-Hook aus tools/hooks/ fängt früher, aber nur bei dem, der ihn installiert hat.
  #
  # Beide rufen dasselbe Skript auf, also melden sie dasselbe.
  script:
    - sh tools/check-template-config.sh

check:audit:
  stage: check
  image: php:8.3-cli
  # Das Sicherheits-Gate aus 006-005-0001. Es braucht KEIN composer install: `--locked`
  # prueft den committeten Lock, nicht ein installiertes vendor/. Damit laeuft es auch
  # dann, wenn der Testlauf an etwas anderem scheitert — ein Sicherheitsbefund soll nicht
  # davon abhaengen, ob die Suite gruen ist.
  #
  # Die fuenf heute unbehebbaren Symfony-4.4-Meldungen stehen einzeln nach CVE-Kennung in
  # composer.json unter config.audit.ignore, jede mit Begruendung. Eine SECHSTE Meldung
  # macht diesen Job sofort rot — das ist der Unterschied zwischen einer Ausnahme und
  # einem abgeschalteten Gate.
  #
  # Der Ablauf steht in tools/ci/audit.sh, damit man ihn lokal nachspielen kann.
  before_script:
    - sh tools/ci/install-composer.sh
  script:
    - sh tools/ci/audit.sh
    # Zweite Haelfte des Gates (006-005-0002): Eine Ausnahme, die nicht mehr greift, macht
    # den Lauf rot. Sonst waere die Liste aus config.audit.ignore nach Epic 009 eine
    # Erlaubnis ins Leere, die stillschweigend weiterwirkt.
    - sh tools/ci/audit-ausnahmen-pruefen.sh

check:phpstan:
  stage: check
  image: php:8.3-cli
  # Die statische Haelfte des "0 Deprecations"-Gates (006-005-0004). Das Laufzeit-Log aus
  # 006-005-0003 zeigt nur, was ein Testlauf AUSGEFUEHRT hat; PHPStan findet deprecated
  # APIs auch in Zweigen, die die Suite nicht betritt.
  #
  # BLOCKIEREND SEIT 009-003-0003. Hier stand allow_failure: true, mit der Begruendung, dass
  # ein Gate, das ab dem ersten Lauf rot ist und erst von Epic 009/010 gruen gemacht werden
  # kann, abgeschaltet statt abgearbeitet wird. Die Bedingung zum Scharfschalten stand in
  # phpstan.neon.dist: "Sobald vendor/-fremde Treffer auf null stehen."
  #
  # Sie ist erfuellt. Von 115 Meldungen sind 31 uebrig, alle aus Doctrine, und sie stehen in
  # phpstan.neon.dist als benannte Ausnahmen mit Epic 010 als aufloesendem Ticket. PHPStan
  # meldet einen Eintrag, der nichts mehr trifft, seinerseits als Fehler — die Liste
  # ueberwacht sich also selbst, wie die beiden anderen Gates aus 006-005.
  #
  # Der Job braucht kein prepare-test-environment.sh und keine Datenbank — statische
  # Analyse fuehrt nichts aus.
  before_script:
    - sh tools/ci/install-php-extensions.sh
    - sh tools/ci/install-composer.sh
    - composer install --no-interaction --no-progress --prefer-dist
  script:
    # --memory-limit=512M ist nicht willkuerlich: Mit dem PHP-Standard von 128M bricht ein
    # Worker bei KALTEM Ergebnis-Cache ab, und PHPStan meldet dann "Result is incomplete"
    # mit WENIGER Treffern — das saehe aus wie Fortschritt. In der CI ist der Cache immer
    # kalt. Nachgemessen in 006-005-0004: 128M kalt unvollstaendig, 512M kalt vollstaendig.
    - ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

# ── Die Testsuiten ─────────────────────────────────────────────────────────────────────

.testlauf:
  stage: test
  services:
    # Zeichensatz und Kollation müssen zu Config::DB_CHARSET / DB_COLLATE passen
    # (utf8 / utf8_unicode_ci), sonst legt die Installation Tabellen an, die nicht zum
    # erwarteten Schema passen — und der Fehler zeigt sich erst weit später. In MySQL 8
    # heissen sie utf8mb3_*; utf8 ist nur noch ein Alias darauf. Dieselben Flags stehen
    # in docker-compose.yml; wer eine ändert, ändert beide.
    #
    # Die Umstellung auf utf8mb4 ist eine Datenmodell-Entscheidung und gehört zu Epic 010.
    - name: mysql:8.0
      alias: mysql
      command:
        - "--character-set-server=utf8mb3"
        - "--collation-server=utf8mb3_unicode_ci"
  before_script:
    - sh tools/ci/install-php-extensions.sh
    # Seit 006-002-0003 gibt es ein Root-Manifest und einen Lock. Der committete vendor/-Baum
    # ist der ALTE Stand; er wird hier ueberschrieben. Mit 006-003 faellt er ganz aus Git und
    # dieser Schritt wird zur einzigen Quelle.
    - sh tools/ci/install-composer.sh
    - composer install --no-interaction --no-progress --prefer-dist
    - sh tools/ci/prepare-test-environment.sh
  script:
    # Ohne --testsuite laufen beide: `unit` ohne Datenbank, `integration` gegen die eben
    # aufgebaute Instanz. Die Trennung ist Absicht und in phpunit.xml.dist begründet.
    #
    # Der Exit-Code wird aufgehoben statt sofort wirksam: Das Deprecation-Gate darunter
    # liest das Serverlog und MUSS auch dann laufen, wenn die Suite rot ist — sonst waere
    # es genau dann blind, wenn am meisten passiert ist. GitLab bricht die script-Liste
    # beim ersten Fehlschlag ab, deshalb der Umweg (006-005-0003).
    - set +e; $PHPUNIT; PHPUNIT_EXIT=$?; set -e
    - sh tools/ci/deprecations-pruefen.sh
    - exit $PHPUNIT_EXIT
  after_script:
    # Der Postausgang der Versandfalle gehört ins Log, auch wenn der Lauf grün war: Eine
    # nicht leere Datei hiesse, dass ein Testlauf zuzustellen versucht hat.
    - echo "--- Postausgang der Versandfalle ---"
    - cat "$CONTENTFLY_TEST_MAIL_TRAP/outbox.log" || true

test:php8.3:
  extends: .testlauf
  image: php:8.3-cli

test:php8.4:
  extends: .testlauf
  image: php:8.4-cli
  # BLOCKIEREND SEIT 010-003-0003. Hier stand allow_failure: true.
  #
  # Die Begründung war zweimal überholt und einmal erfüllt. Zuerst hiess sie „der Silex-Stand
  # ist auf 8.4 nicht erprobt" — Silex fiel mit Epic 009. Dann: „Ob der Job blockierend werden
  # kann, entscheidet ein Lauf auf 8.4, nicht diese Zeile."
  #
  # Der Lauf liegt vor, und zwar zweimal, auf zwei verschiedenen Ständen:
  #
  #   009-004-0002   Symfony 7.4, Doctrine ORM 2.20   OK (267 tests), 0 Deprecations
  #   010-003-0003   Symfony 7.4, Doctrine ORM 3.7    OK (268 tests), 0 Deprecations
  #
  # Beide im Image php:8.4-cli gegen einen mysql:8.0-Service, mit dem Wortlaut dieses Jobs.
  #
  # Eine Bedingung, die eine Datei selbst benennt und die erfüllt ist, gehoert eingelöst — es
  # ist dieselbe Regel, an der die drei Gates haengen. Zielplattform bleibt PHP 8.5; was hier
  # rot wird, ist ab jetzt ein Fehler und keine Vorschau.
