# Dependabot — Versions-Updates (000-000-0055).
#
# WAS DIESE DATEI NICHT TUT: Sicherheits-Updates. Die kommen aus den Repository-Einstellungen
# (Security → Dependabot alerts / security updates) und brauchen keine Konfiguration. Diese
# Datei ist die andere Haelfte: den Baum aktuell halten, statt nur auf CVEs zu reagieren.
#
# Der Unterschied zaehlt, weil er oft verwechselt wird — und weil ein Repository ohne diese
# Datei trotzdem Sicherheits-Updates bekommt, sobald die Einstellung gesetzt ist.
#
# WARUM GRUPPIERT: Ohne `groups` oeffnet Dependabot einen Pull Request JE PAKET. Bei 55
# Paketen plus 30 Dev-Paketen ergibt das eine Liste, die niemand abarbeitet — und eine Liste
# unbearbeiteter Bot-PRs ist schlimmer als keine: Sie trainiert das Wegklicken, und der eine
# wichtige geht darin unter. Gruppiert wird daraus ein Pull Request pro Woche und Oekosystem.
#
# Majors bleiben ABSICHTLICH einzeln. Ein Major kann brechen; er gehoert angesehen, nicht
# mitgeschwemmt.

# ── EINZUTRAGEN, DAMIT DIE PULL REQUESTS DIESES BOTS GRUEN WERDEN KOENNEN ─────────────
#
# Ein Dependabot-PR bekommt die normalen Repository-Secrets NICHT. GitHub faehrt ihn mit
# einem eingeschraenkten Token und reicht ihm nur durch, was unter
#
#   Settings → Secrets and variables → DEPENDABOT
#
# liegt — ein anderer Reiter als `Actions`. Dort muss stehen:
#
#   CONTENTFLY_TEST_ADMIN_PASS   damit die beiden Testjobs laufen
#
# NICHT dort stehen darf PAKET_REPO_DEPLOY_KEY. Der Job `bezugsweg` wird bei Dependabot
# stattdessen uebersprungen; die Begruendung steht in pipeline.yml bei diesem Job.
#
# Gefunden an PR #13 (2026-09-17), der actions/checkout auf v7 heben wollte und daran
# scheiterte. Ohne diesen Eintrag ist JEDER Pull Request dieses Bots rot — und ein Bot,
# dessen PRs grundsaetzlich rot sind, erzeugt genau die Liste, die die Gruppierung
# weiter unten vermeiden soll. Nur eben in Rot.

version: 2
updates:
  # ── PHP-Abhaengigkeiten ────────────────────────────────────────────────────────────────
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-und-patch:
        update-types: [minor, patch]
    commit-message:
      # Passt zur Commit-Konvention dieses Projekts (an_project/docs/git.md).
      prefix: chore
      include: scope

  # ── GitHub Actions ────────────────────────────────────────────────────────────────────
  #
  # MIT AUFGENOMMEN, UND ZWAR AUS EINEM KONKRETEN ANLASS: `actions/checkout` stand bis zum
  # 2026-09-17 auf @v4 und erklaerte damit `using: node20`, waehrend die Runner es laengst
  # zwangsweise auf Node 24 fuhren. Die Warnung stand in JEDEM Lauf; aufgefallen ist sie
  # trotzdem erst, als jemand hinsah (000-000-0052). Genau das soll ein Bot uebernehmen.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
